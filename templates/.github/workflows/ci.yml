name: CI
# 検証のジョブを並べ、最後の「CI result」が全部を needs で待って成否を出す。
# ルールセットの必須チェックは「CI result」だけにする（setup.md §2）。ジョブを足しても needs に加えるだけで、ルールセットは直さずに済む。
# <検証のコマンド> と Build の step はゲームに合わせて書き換える。Actions は full SHA で固定し、pull_request_target は使わない。
#
# 同時に動けるランナーが少ない（1〜2 台）とき：ジョブを増やすと待ち行列で遅くなる。その場合は test を 1 つにまとめるか、
# まとめ役を置かずに最後のテストジョブが他のジョブを API で待つ形にする（元のゲームではそうした）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # テストを分けないなら shard: ["1/1"] にして env の SHARD を消す
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: <ビルドのコマンド（不要なら step ごと消す。例：node tools/build.mjs）>
      - name: Test
        run: <検証のコマンド（例：node tests/run.mjs）>
        env:
          SHARD: ${{ matrix.shard }}
  result:
    name: CI result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [test]
    # 前のジョブが失敗・取り消しでも必ず走り、ここで成否を決める
    if: ${{ always() }}
    steps:
      - name: Check
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test: $RESULT"
          [ "$RESULT" = success ]
