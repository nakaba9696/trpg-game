name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # テストは 2 つのジョブに分ける（T2。分け方は tests/run.mjs の SHARD と WEIGHT。1/2 と 2/2 で全部の確認が一度ずつ走る）。
  # 同時に動けるランナーが 1〜2 台しかないので、ジョブは 2 つまで。まとめ役のジョブは作らず、
  # 「CI result」が 2/2 を動かしたあと、Test 1/2 の結果を待って一緒に成否を出す（ルールセットの必須チェックは「CI result」だけ）。
  # 1 つのジョブにまとめると、いまの中身で 20 分の timeout に近い（テストが増えて 2/2 が 20 分を超えたので、timeout は 35 分に延ばした。main の 5 分割の合計が約 21 分）。
  test1:
    name: Test 1/2
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: node tools/build.mjs
      - name: Test
        run: node tests/run.mjs
        env:
          SHARD: 1/2
  result:
    name: CI result
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: node tools/build.mjs
      - name: Test
        run: node tests/run.mjs
        env:
          SHARD: 2/2
      - name: Wait for Test 1/2
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          while :; do
            s=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" --jq '.jobs[] | select(.name == "Test 1/2") | "\(.status) \(.conclusion)"')
            echo "Test 1/2: ${s:-（まだ無い）}"
            case "$s" in
              "completed success") exit 0 ;;
              completed*) exit 1 ;;
            esac
            sleep 20
          done
